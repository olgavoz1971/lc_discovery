[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lc_discovery"
version = "0.1.0"
description = "Light-curve discovery: catalogue search and calibrated VOTable fetch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "UPJS / SKVO" }]
dependencies = [
    "numpy",
    "astropy",
    "pandas",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live TAP or network tests (run with pytest -m integration)",
]
