[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lc_discovery"
version = "0.0.3"
description = "Light-curve discovery: catalogue search and calibrated VOTable fetch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{name = "Olga Vozyakova", email = "olgavoz@gmail.com"}]
dependencies = [
    "numpy",
    "astropy",
    "pandas",
    "requests",
    "pyvo",
    "volightcurve @ git+https://github.com/olgavoz1971/volightcurve.git",
]

[project.optional-dependencies]
dev = ["pytest", "volightcurve[read] @ git+https://github.com/olgavoz1971/volightcurve.git"]
tess = ["lightkurve"]
asassn = ["skypatrol @ git+https://github.com/olgavoz1971/skypatrol.git@master"]
scripts = ["astroquery"]
tools = ["mocpy", "tess-point"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live TAP or network tests (run with pytest -m integration)",
]
